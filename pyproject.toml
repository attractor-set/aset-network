[project]
name = "aset-network-extension"
version = "0.1.0a3"
description = "Minimal cross-context evidence admission extension for ASET Seed"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.urls]
SeedSpecification = "https://github.com/attractor-set/ASET"
Repository = "https://github.com/attractor-set/aset-network-extension"
SeedReferenceImplementation = "https://github.com/attractor-set/aset-python-sqlite"
ReferenceImplementation = "https://github.com/attractor-set/aset-network-python-sqlite"
