name: extension-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m tools.bootstrap_tla
      - run: python -m tools.validate_extension
      - run: python -m tools.run_conformance
      - run: python -m pytest -q
      - run: ruff format --check .
      - run: ruff check .
      - name: Download pinned TLAPM
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/tlapm-1.6.0-pre-x86_64-linux-gnu.tar.gz"
          unpack="$RUNNER_TEMP/tlapm-unpacked"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://github.com/tlaplus/tlapm/releases/download/1.6.0-pre/tlapm-1.6.0-pre-x86_64-linux-gnu.tar.gz
          echo "bfa5e5350ac1ec7202feecad0a4a71a5bb58c16a49660448b35b6f371ba9e2f5  $archive" \
            | sha256sum --check
          mkdir -p "$unpack"
          tar -xzf "$archive" -C "$unpack"
          tlapm_bin="$(find "$unpack" -type f -path '*/bin/tlapm' -print -quit)"
          test -n "$tlapm_bin"
          test -x "$tlapm_bin"
          test "$("$tlapm_bin" --version)" = "4600b24"
          echo "TLAPM_BIN=$tlapm_bin" >> "$GITHUB_ENV"
      - name: Fetch pinned ASET Seed
        shell: bash
        run: |
          set -euo pipefail
          seed_commit="633c130187b2a2bb42f24cfd66662d475de385d2"
          seed_root="$RUNNER_TEMP/ASET-seed"
          git init "$seed_root"
          git -C "$seed_root" remote add origin https://github.com/attractor-set/ASET.git
          git -C "$seed_root" fetch --depth 1 origin "$seed_commit"
          git -C "$seed_root" checkout --detach FETCH_HEAD
          test "$(git -C "$seed_root" rev-parse HEAD)" = "$seed_commit"
          echo "SEED_ROOT=$seed_root" >> "$GITHUB_ENV"
      - name: Fetch pinned ASET public-v60 assurance subject
        shell: bash
        run: |
          set -euo pipefail
          assurance_commit="e89d984203a126f8bc62467224cdf6c5374dada7"
          assurance_root="$RUNNER_TEMP/ASET-assurance"
          git init "$assurance_root"
          git -C "$assurance_root" remote add origin https://github.com/attractor-set/ASET.git
          git -C "$assurance_root" fetch --depth 1 origin "$assurance_commit"
          git -C "$assurance_root" checkout --detach FETCH_HEAD
          test "$(git -C "$assurance_root" rev-parse HEAD)" = "$assurance_commit"
          python "$assurance_root/tools/build_seed_recognition_boundary_assurance.py" --check
          echo "ASSURANCE_ROOT=$assurance_root" >> "$GITHUB_ENV"
      - name: Run full formal release gate
        timeout-minutes: 30
        run: |
          python -m tools.run_formal_release_gate \
            --tlapm "$TLAPM_BIN" \
            --seed-root "$SEED_ROOT" \
            --assurance-root "$ASSURANCE_ROOT"
      - name: Verify exact committed tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Verify deterministic INPI deposit generation
        id: inpi_deposit
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.build_release --verify-determinism
          checksum="dist/ASET-Network-Extension-Repository-Snapshot.zip.sha256"
          (cd dist && sha256sum --check ASET-Network-Extension-Repository-Snapshot.zip.sha256)
          digest="$(cut -d' ' -f1 "$checksum")"
          printf 'INPI_DEPOSIT_SHA256=%s\n' "$digest"
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf '### INPI deposit snapshot\n\n`%s`\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload formal release evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aset-network-extension-formal-release-evidence-${{ github.sha }}
          if-no-files-found: warn
          path: |
            dist/formal-release-gate.json
            dist/network-canon-refinement-proof.json
            dist/network-seed-refinement-proof.json
            dist/network-seed-projection-assurance.json
      - name: Upload INPI deposit snapshot
        uses: actions/upload-artifact@v4
        with:
          name: aset-network-extension-inpi-deposit-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/ASET-Network-Extension-Repository-Snapshot.zip
            dist/ASET-Network-Extension-Repository-Snapshot.zip.sha256
