name: extension-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-ci.txt
      - run: python tools/validate_extension.py
      - run: python tools/model_check_network.py
      - run: python tools/run_conformance.py
      - run: python -m pytest -q
      - run: ruff check .
