name: Seed projection assurance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed-projection-assurance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Network Extension
        uses: actions/checkout@v4

      - name: Checkout pinned ASET assurance subject
        uses: actions/checkout@v4
        with:
          repository: attractor-set/ASET
          ref: e89d984203a126f8bc62467224cdf6c5374dada7
          path: .upstream/ASET

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test requirements
        run: python -m pip install -r requirements-ci.txt

      - name: Verify public v60 package identity
        run: python .upstream/ASET/tools/build_seed_recognition_boundary_assurance.py --check

      - name: Check Network -> Seed -> public-v60 projection assurance
        run: |
          python tools/check_seed_projection_assurance.py \
            --seed-root .upstream/ASET \
            --output dist/network-seed-projection-assurance.json

      - name: Run projection-assurance tests
        run: python -m pytest -q tests/test_seed_projection_assurance.py

      - name: Upload projection-assurance evidence
        uses: actions/upload-artifact@v4
        with:
          name: network-seed-projection-assurance
          path: dist/network-seed-projection-assurance.json
