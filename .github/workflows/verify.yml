name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m tools.bootstrap_tla
      - name: Validate current Network Alpha4 three-way representation
        run: python -m tools.alpha4_network_gate
      - name: Verify ASET Seed 0.4alpha 3-way content binding
        shell: bash
        run: |
          set -euo pipefail
          seed_tag="seed-0.4alpha-3way"
          seed_commit="0028f1d25a4f1d052a9b998baf402898446ac599"
          seed_alpha4_root="$RUNNER_TEMP/aset-seed-alpha4"
          git clone --depth 1 --branch "$seed_tag" https://github.com/attractor-set/aset-seed.git "$seed_alpha4_root"
          test "$(git -C "$seed_alpha4_root" rev-parse HEAD)" = "$seed_commit"
          python -m tools.validate_alpha4_network --seed-root "$seed_alpha4_root"
      - run: python -m pytest -q
      - run: ruff format --check .
      - run: ruff check .
      - name: Download pinned TLAPM
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/tlapm-1.6.0-pre-x86_64-linux-gnu.tar.gz"
          unpack="$RUNNER_TEMP/tlapm-unpacked"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://github.com/tlaplus/tlapm/releases/download/1.6.0-pre/tlapm-1.6.0-pre-x86_64-linux-gnu.tar.gz
          echo "bfa5e5350ac1ec7202feecad0a4a71a5bb58c16a49660448b35b6f371ba9e2f5  $archive" \
            | sha256sum --check
          mkdir -p "$unpack"
          tar -xzf "$archive" -C "$unpack"
          tlapm_bin="$(find "$unpack" -type f -path '*/bin/tlapm' -print -quit)"
          test -n "$tlapm_bin"
          test -x "$tlapm_bin"
          test "$("$tlapm_bin" --version)" = "4600b24"
          echo "TLAPM_BIN=$tlapm_bin" >> "$GITHUB_ENV"
      - name: Prove Network Alpha4 operational-relational relation
        run: python -m tools.run_alpha4_network_tlaps --tlapm "$TLAPM_BIN"
      - name: Prove Network Alpha4 profile operational-relational relations and boundaries
        run: python -m tools.run_alpha4_network_profile_tlaps --tlapm "$TLAPM_BIN"
      - name: Check Network Alpha4 profile safety and liveness composition
        run: python -m tools.run_alpha4_network_profile_tlc
      - name: Verify exact committed tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Verify deterministic repository snapshot
        run: python -m tools.build_snapshot --verify-determinism
      - name: Upload deterministic repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: aset-network-snapshot-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/ASET-Network-Repository-Snapshot.zip
            dist/ASET-Network-Repository-Snapshot.zip.sha256
